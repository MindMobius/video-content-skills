<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">别急着判它没有意义</title>
  <desc id="desc">用工况、比较维度和任务状态三组判断，说明航天科普下结论前应怎样核对数据与边界。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#0a1828"/>
      <stop offset="1" stop-color="#10243a"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb35c"/>
      <stop offset="1" stop-color="#ff7b54"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79e7f2"/>
      <stop offset="1" stop-color="#47b8da"/>
    </linearGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#8fb4cc" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020811" flood-opacity="0.38"/>
    </filter>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
      .muted { fill: #91a9bb; }
      .body { fill: #d6e2eb; font-size: 29px; font-weight: 500; }
      .card-title { fill: #f7fbff; font-size: 40px; font-weight: 800; }
      .label { fill: #07111f; font-size: 22px; font-weight: 800; letter-spacing: 1px; }
      .number { fill: #07111f; font-size: 25px; font-weight: 900; }
    </style>
  </defs>

  <rect width="1200" height="1600" fill="url(#bg)"/>
  <rect width="1200" height="1600" fill="url(#grid)"/>
  <circle cx="1085" cy="110" r="220" fill="#1a6380" opacity="0.12"/>
  <circle cx="1125" cy="90" r="130" fill="#ff8d58" opacity="0.09"/>
  <path d="M930 64c88 40 139 94 177 184" fill="none" stroke="#79e7f2" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="10 14"/>
  <path d="M1099 239l-4-26-21 15" fill="none" stroke="#79e7f2" stroke-opacity="0.5" stroke-width="3"/>

  <g transform="translate(78 66)">
    <rect width="212" height="42" rx="21" fill="url(#cyan)"/>
    <text class="label" x="106" y="29" text-anchor="middle">航天科普 · 判断框架</text>
  </g>

  <text x="78" y="180" fill="#f7fbff" font-size="76" font-weight="900" letter-spacing="-2">别急着判它</text>
  <text x="78" y="274" fill="url(#orange)" font-size="92" font-weight="900" letter-spacing="-3">「没有意义」</text>
  <text x="82" y="335" fill="#b9ccd9" font-size="29" font-weight="500">我们反对的不是质疑，而是拿错数据、错工况和错比较来下结论。</text>

  <g filter="url(#shadow)">
    <rect x="70" y="386" width="1060" height="260" rx="30" fill="#102235" stroke="#234158" stroke-width="2"/>
    <rect x="70" y="386" width="12" height="260" rx="6" fill="url(#orange)"/>
  </g>
  <g transform="translate(108 416)">
    <rect width="118" height="39" rx="19" fill="#ff9c58"/>
    <text class="number" x="59" y="28" text-anchor="middle">01 工况</text>
    <text class="card-title" x="0" y="92">极限参数 ≠ 实际工作点</text>
    <text class="body" x="0" y="140">
      <tspan x="0" dy="0">把 40% 极限节流直接代入回收计算，推重比约为 1.42；</tspan>
      <tspan x="0" dy="43">按回收安全区间约 57% 复算，结果才回到约 2。</tspan>
    </text>
    <g transform="translate(748 22)">
      <path d="M70 26A70 70 0 0 1 196 79" fill="none" stroke="#35556b" stroke-width="15" stroke-linecap="round"/>
      <path d="M70 26A70 70 0 0 1 151 23" fill="none" stroke="#ff9c58" stroke-width="15" stroke-linecap="round"/>
      <circle cx="70" cy="96" r="7" fill="#79e7f2"/>
      <path d="M70 96L147 44" stroke="#79e7f2" stroke-width="6" stroke-linecap="round"/>
      <text x="70" y="139" fill="#ffad6d" font-size="27" font-weight="800">40% → 1.42</text>
      <text x="70" y="175" fill="#79e7f2" font-size="27" font-weight="800">57% → ≈ 2</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="674" width="1060" height="260" rx="30" fill="#102235" stroke="#234158" stroke-width="2"/>
    <rect x="70" y="674" width="12" height="260" rx="6" fill="url(#cyan)"/>
  </g>
  <g transform="translate(108 704)">
    <rect width="118" height="39" rx="19" fill="#68d9e8"/>
    <text class="number" x="59" y="28" text-anchor="middle">02 比较</text>
    <text class="card-title" x="0" y="92">第一步尝试 ≠ 必须碾压成熟型号</text>
    <text class="body" x="0" y="140">
      <tspan x="0" dy="0">长十乙与猎鹰 9 的体量、成熟度和试飞目标并不相同。</tspan>
      <tspan x="0" dy="43">只看干质比不如，就断言回收“没有意义”，基准已经错位。</tspan>
    </text>
    <g transform="translate(770 161)">
      <rect x="0" y="0" width="82" height="37" rx="18" fill="#18394c" stroke="#68d9e8"/>
      <rect x="91" y="0" width="82" height="37" rx="18" fill="#18394c" stroke="#68d9e8"/>
      <rect x="182" y="0" width="82" height="37" rx="18" fill="#18394c" stroke="#68d9e8"/>
      <text x="41" y="26" text-anchor="middle" fill="#bceef5" font-size="22" font-weight="700">体量</text>
      <text x="132" y="26" text-anchor="middle" fill="#bceef5" font-size="22" font-weight="700">阶段</text>
      <text x="223" y="26" text-anchor="middle" fill="#bceef5" font-size="22" font-weight="700">目标</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="962" width="1060" height="260" rx="30" fill="#102235" stroke="#234158" stroke-width="2"/>
    <rect x="70" y="962" width="12" height="260" rx="6" fill="#8e7cf7"/>
  </g>
  <g transform="translate(108 992)">
    <rect width="118" height="39" rx="19" fill="#9b8cff"/>
    <text class="number" x="59" y="28" text-anchor="middle">03 状态</text>
    <text class="card-title" x="0" y="92">极限训练 ≠ 正常飞行</text>
    <text class="body" x="0" y="140">
      <tspan x="0" dy="0">8G 对应紧急逃逸等极限情形的能力冗余，不是长二 F</tspan>
      <tspan x="0" dy="43">正常发射的常态；龙飞船乘组也需要训练，发射也有过载。</tspan>
    </text>
    <g transform="translate(754 153)">
      <rect width="124" height="42" rx="21" fill="#1b3b4c" stroke="#68d9e8"/>
      <text x="62" y="29" text-anchor="middle" fill="#a7eaf2" font-size="22" font-weight="700">正常工况</text>
      <path d="M137 21h55" stroke="#7591a4" stroke-width="3" stroke-dasharray="7 6"/>
      <path d="M184 13l10 8-10 8" fill="none" stroke="#7591a4" stroke-width="3"/>
      <rect x="207" width="124" height="42" rx="21" fill="#332b57" stroke="#9b8cff"/>
      <text x="269" y="29" text-anchor="middle" fill="#d5ceff" font-size="22" font-weight="700">紧急逃逸</text>
    </g>
  </g>

  <g transform="translate(70 1252)">
    <rect width="1060" height="210" rx="28" fill="#f5f1e8"/>
    <text x="38" y="56" fill="#152639" font-size="34" font-weight="900">下结论前，我们会先问 4 个问题</text>
    <g transform="translate(38 88)">
      <circle cx="21" cy="21" r="21" fill="#ff9857"/><text x="21" y="29" text-anchor="middle" fill="#08121f" font-size="22" font-weight="900">1</text>
      <text x="54" y="29" fill="#21384a" font-size="27" font-weight="800">数据从哪来？</text>
      <circle cx="280" cy="21" r="21" fill="#62d6e5"/><text x="280" y="29" text-anchor="middle" fill="#08121f" font-size="22" font-weight="900">2</text>
      <text x="313" y="29" fill="#21384a" font-size="27" font-weight="800">是不是同一工况？</text>
      <circle cx="625" cy="21" r="21" fill="#9b8cff"/><text x="625" y="29" text-anchor="middle" fill="#08121f" font-size="22" font-weight="900">3</text>
      <text x="658" y="29" fill="#21384a" font-size="27" font-weight="800">同量级、同阶段吗？</text>
      <circle cx="21" cy="81" r="21" fill="#f3c969"/><text x="21" y="89" text-anchor="middle" fill="#08121f" font-size="22" font-weight="900">4</text>
      <text x="54" y="89" fill="#21384a" font-size="27" font-weight="800">说的是正常任务，还是极限冗余？</text>
    </g>
  </g>

  <text x="75" y="1516" fill="#f4f8fb" font-size="29" font-weight="800">科普可以简化，但不能让感觉替代资料。被指出事实错误，先核查，再修正。</text>
  <text x="75" y="1560" class="muted" font-size="21">证据边界｜0:00–7:20 完整字幕；技术参数按原论证保留，未作独立外部核验 · BV1v6Kf6rEYh</text>
</svg>
