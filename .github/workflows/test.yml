name: test

on:
  push:
  pull_request:

jobs:
  python:
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: >-
          python -m pip install
          -c requirements/mcp-constraints.txt
          -e ".[mcp,dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Format
        run: python -m ruff format --check .

      - name: Test
        run: python -m pytest

      - name: MCP protocol smoke
        run: python scripts/mcp_smoke.py

  clean-agent-contract:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node development contract
        run: npm ci --ignore-scripts

      - name: Test browser adapter and package surface
        run: |
          npm test
          npm run pack:check

      - name: Discover project Skills
        run: npx -y skills@1.5.22 add . --list

      - name: Bootstrap clean checkout
        run: >-
          python scripts/bootstrap.py --apply
          --config .video-content/config.json
          --capability hard_ocr_local > bootstrap.json

      - name: Validate Agent invocation contract
        run: >-
          python -c "import json, pathlib;
          report=json.loads(pathlib.Path('bootstrap.json').read_text());
          assert report['schema_version']=='video-content/bootstrap-v2';
          assert not report['ready'];
          assert report['status']=='agent_action_required';
          assert report['installation']['ready'];
          assert report['setup']['requested_capabilities']==['hard_ocr_local'];
          assert report['setup']['status']=='agent_action_required';
          assert any(item['dependency_id']=='videocr' for item in report['agent_actions']);
          assert report['human_actions']==[];
          assert [item['name'] for item in report['skills']['available']]
          == ['video-evidence', 'video-to-content', 'watch-later-to-wechat', 'wechat-draft'];
          assert report['installation']['lock']['verified'];
          assert report['mcp']['server_name']=='video_content';
          assert report['mcp']['transport']=='stdio';
          assert report['mcp']['env']['VIDEO_CONTENT_CONFIG']
          == report['setup']['configuration']['path']"

      - name: Reproduce deterministic Agent contract
        run: >-
          .venv/bin/python scripts/repro_check.py
          --require-tier core
          --require-tier agent
