[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "video-subtitle-skill"
version = "0.6.0"
description = "Agent-first video subtitle evidence and traceable content transformation tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MindMobius contributors" }]
dependencies = []

[project.urls]
Repository = "https://github.com/MindMobius/video-subtitle-skill"
Issues = "https://github.com/MindMobius/video-subtitle-skill/issues"

[project.optional-dependencies]
mcp = ["mcp==2.0.0"]
dev = ["jsonschema==4.26.0", "pytest==9.1.1", "ruff==0.16.1"]

[project.scripts]
video-subtitle = "video_subtitle.cli:main"
video-subtitle-mcp = "video_subtitle.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_subtitle = ["requirements.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
[tool.ruff.lint.per-file-ignores]
".agents/skills/wechat-draft-handoff/scripts/prepare_clipboard.py" = ["E402"]
"scripts/render_wechat_article.py" = ["E402"]
"scripts/repro_check.py" = ["E402"]

